name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run a subset of tests'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: '3.9.13'
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.11'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.11'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache-build: true
        allow-build: allow
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox exec -- pytest ${{ inputs.test-filter }}
        else
          python -m tox
        fi
    - name: Package
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      shell: bash
      run: |
        echo "hatchling==1.14.0" > "$RUNNER_TEMP/build-constraints.txt"
        export PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"
        python -m pip install --upgrade build
        export PIP_INDEX_URL='https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/'
        python -m build -s -w
        ls -la dist
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-latest' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
